<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Networking Queue - Pixel Labs</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">Pixel Labs <span>Network Builder</span></div>
        <div class="nav-links">
            <a class="nav-link" onclick="showPage('dashboard')">Dashboard</a>
            <a class="nav-link" onclick="showPage('import')">Import</a>
            <a class="nav-link active" onclick="showPage('queue')">Queue</a>
            <a class="nav-link" onclick="showPage('history')">History</a>
            <a class="nav-link" onclick="showPage('settings')">Settings</a>
        </div>
    </nav>
    <div class="container">
        <div class="section-header">
            <h1 class="section-title">Networking Queue</h1>
            <div style="display: flex; gap: 8px;">
                <select id="queue-target-page" class="form-select" style="width: auto;" onchange="loadQueue()">
                    <option value="10">10/day</option>
                    <option value="15">15/day</option>
                    <option value="20" selected>20/day</option>
                    <option value="25">25/day</option>
                </select>
                <button class="btn btn-primary btn-sm" onclick="loadQueue()">Refresh</button>
                <button class="btn btn-success btn-sm" onclick="exportQueue()">Export CSV</button>
            </div>
        </div>
        <div id="queue-full-container"></div>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
